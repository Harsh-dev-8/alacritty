
[general]
import = ["~/.config/alacritty/themes/gruvbox_dark_soft.toml","/home/harsh/.config/alacritty/themes/12-bit_rainbow.toml"]

[cursor.style]
shape = "Block"
blinking = "off"

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

[font]
size = 16

[font.normal]
family = "Mona Sans Mono"
style = "Regular"

[font.bold]
family = "Mona Sans Mono"
style = "Bold"

[font.italic]
family = "Mona Sans Mono"
style = "Regular"

[font.bold_italic]
family = "Mona Sans Mono"
style = "Bold"

[window]
opacity = 1
decorations = "Full"
dynamic_title = true
startup_mode = "Fullscreen"

[window.padding]
x = 8
y = 8
