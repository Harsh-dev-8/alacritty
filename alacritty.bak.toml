[general]
import = ["~/.config/alacritty/themes/gruvbox_dark_soft.toml","/home/harsh/.config/alacritty/themes/12-bit_rainbow.toml"]

[cursor]
thickness = 0.5

[cursor.style]
shape = "Underline"
blinking = "Off"

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

[font]
size = 13

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
opacity = 1
decorations = "Full"
dynamic_title = true
startup_mode = "Fullscreen"

[window.padding]
x = 0
y = 0
