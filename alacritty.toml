general.import = [
  "~/.config/alacritty/themes/gruvbox_dark_soft.toml"
]
[cursor]
style = { shape = "Block", blinking = "off" }

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

[font]
size = 17.0

[window]
padding = { x = 8, y = 8 }
opacity = 1.0
decorations = "Full"
dynamic_title = true
startup_mode = "Fullscreen"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
