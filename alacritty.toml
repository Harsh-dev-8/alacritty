
[general]
import = ["~/.config/alacritty/themes/gruvbox_dark_soft.toml","/home/harsh/.config/alacritty/themes/kanagawa_dragon.toml"]

[cursor]
thickness = 0.5

[cursor.style]
shape = "Underline"
blinking = "Off"

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

[font]
size = 14

# [font.normal]
# family = "JetBrainsMono Nerd Font Mono"
# style = "Regular"
#
# [font.bold]
# family = "JetBrainsMono Nerd Font"
# style = "Bold"
#
# [font.italic]
# family = "JetBrainsMono Nerd Font"
# style = "Regular"
#
# [font.bold_italic]
# family = "JetBrainsMono Nerd Font"
# style = "Regular"
#
# Iosevka Fonts
[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[font.bold]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[font.italic]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[font.bold_italic]
family = "IosevkaTerm Nerd Font"
style = "Regular"



# family = "BigBlueTerm437 Nerd Font"

[window]
opacity = 1.0
decorations = "Full"
dynamic_title = true
startup_mode = "Fullscreen"

[window.padding]
x = 0
y = 0
